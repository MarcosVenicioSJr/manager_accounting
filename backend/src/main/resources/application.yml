spring:
  application:
    name: manager_accounting

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manager_accounting}
    username: ${DB_USERNAME:manager}
    password: ${DB_PASSWORD:manager}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Em desenvolvimento os e-mails vão para o Mailpit (http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Tempo máximo (ms) para não prender a fila de envio se o SMTP estiver fora do ar
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  web:
    # Endereço do front, usado nos links dos e-mails (ex.: link de redefinição de senha)
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@manageraccounting.local}
    from-name: ${MAIL_FROM_NAME:Backoffice contábil}
  security:
    jwt:
      # Obrigatório (mínimo 32 caracteres). Sem valor o backend não sobe.
      # Em desenvolvimento ("mvn spring-boot:run") vem do application-dev.yml.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:4h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:8h}
    refresh-cookie:
      # Em produção (HTTPS) mantenha secure=true
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    recuperacao-senha:
      # Validade do link enviado por e-mail
      token-ttl: ${RECUPERACAO_SENHA_TOKEN_TTL:30m}
      # Por usuário: tempo mínimo entre dois e-mails e máximo de e-mails por hora
      intervalo-minimo: ${RECUPERACAO_SENHA_INTERVALO_MINIMO:2m}
      max-envios-por-hora: ${RECUPERACAO_SENHA_MAX_ENVIOS_POR_HORA:5}
  perfil:
    confirmacao:
      # Meu perfil: validade do link que confirma a troca de senha ou de e-mail
      token-ttl: ${PERFIL_CONFIRMACAO_TOKEN_TTL:30m}
      # Por usuário e por tipo: tempo mínimo entre dois pedidos e máximo de pedidos por hora
      intervalo-minimo: ${PERFIL_CONFIRMACAO_INTERVALO_MINIMO:1m}
      max-envios-por-hora: ${PERFIL_CONFIRMACAO_MAX_ENVIOS_POR_HORA:5}
