spring:
  application:
    name: manager_accounting

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manager_accounting}
    username: ${DB_USERNAME:manager}
    password: ${DB_PASSWORD:manager}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Em desenvolvimento os e-mails vão para o Mailpit (http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@manageraccounting.local}
  security:
    jwt:
      # Obrigatório (mínimo 32 caracteres). Sem valor o backend não sobe.
      # Em desenvolvimento ("mvn spring-boot:run") vem do application-dev.yml.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:4h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:8h}
    refresh-cookie:
      # Em produção (HTTPS) mantenha secure=true
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
